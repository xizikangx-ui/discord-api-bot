plugins { id 'com.android.application' }
android {
    namespace 'app.yichang.book'
    compileSdk 35
    defaultConfig { applicationId 'app.yichang.book'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.1.0' }
    signingConfigs {
        release {
            if (System.getenv('YICHANG_ANDROID_STORE_PATH')) {
                storeFile file(System.getenv('YICHANG_ANDROID_STORE_PATH'))
                storePassword System.getenv('YICHANG_ANDROID_STORE_PASSWORD')
                keyAlias 'yichangbook'
                keyPassword System.getenv('YICHANG_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main.assets.srcDirs += "$buildDir/generated/updateAssets" }
}
tasks.register('copyUpdatePublicKey', Copy) {
    from rootProject.file('../update-public-key.pem')
    into "$buildDir/generated/updateAssets"
    doFirst { if (!rootProject.file('../update-public-key.pem').isFile()) throw new GradleException('Missing fixed update public key.') }
}
tasks.named('preBuild').configure { dependsOn 'copyUpdatePublicKey' }
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!System.getenv('YICHANG_ANDROID_STORE_PATH') || !System.getenv('YICHANG_ANDROID_STORE_PASSWORD'))
            throw new GradleException('Release builds require the operator signing key in YICHANG_ANDROID_STORE_PATH and YICHANG_ANDROID_STORE_PASSWORD.')
    }
}
