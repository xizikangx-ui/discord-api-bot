<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'"><title>异常之书 · 客户端更新</title><style>body{margin:0;background:#131b30;color:#dce5f6;font:14px/1.8 system-ui;padding:28px}h1{font-size:25px;font-weight:500;color:#dccbff}small{color:#a7b9d4}.versions{display:flex;gap:24px;margin:20px 0}.versions span{display:grid}.versions b{font-size:21px;color:#f1e8ff}progress{width:100%;height:8px;accent-color:#b8a5ef}pre{white-space:pre-wrap;font:inherit;max-height:170px;overflow:auto;border-left:2px solid #8d7bab;padding:8px 12px;color:#c7d5ec}button{padding:11px 16px;border-radius:8px;background:#363c5c;border:1px solid #7a7199;color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}#install{background:#c2b0f0;color:#191c34}footer{display:flex;gap:8px;margin-top:25px}#message{min-height:55px}#size{display:block;margin-top:8px}</style><h1>客户端更新</h1><small>网页与跑团内容会随网站发布更新；这里更新应用本身。</small><div class="versions"><span>当前版本<b id="current">…</b></span><span>最新版本<b id="latest">—</b></span></div><p id="message" role="status">正在读取更新状态…</p><progress id="progress" max="100" value="0" hidden></progress><small id="size"></small><pre id="notes" hidden></pre><footer><button id="check">检查更新</button><button id="install" hidden>重启并安装</button><button id="later">稍后</button></footer><script src="updates-ui.js"></script></html>
