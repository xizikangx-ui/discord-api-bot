name: Stability browser acceptance
on:
  push:
    branches: [fix/stability-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --no-fund
      - run: npm --prefix web ci --no-fund
      - run: npm --prefix gm-web ci --no-fund
      - run: npm --prefix web run build && npm --prefix gm-web run build
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test --config playwright.stability.config.cjs
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stability-browser-evidence
          path: test-results/stability-browser
          retention-days: 7
